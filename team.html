<style>
  :root {
    --orange: #FC4C02;
    --black: #0a0a0a;
    --card: #141414;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(252,76,2,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(252,76,2,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 5rem;
    position: relative;
    z-index: 1;
  }

  .top-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 2.5rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px 6px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    transition: border-color 0.2s, color 0.2s;
  }
  .back-link:hover { border-color: var(--orange); color: var(--text); }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--orange);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    color: #fff;
    letter-spacing: 1px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(252,76,2,0.4);
    text-decoration: none;
  }

  .page-hero {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .page-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 6rem);
    color: var(--orange);
    letter-spacing: 3px;
    line-height: 1;
    text-shadow: 0 0 60px rgba(252,76,2,0.5), 0 2px 12px rgba(0,0,0,0.8);
  }

  .page-hero p {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .founders-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 3rem;
  }

  .crew-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 460px;
    margin: 0 auto;
  }

  @media (max-width: 680px) {
    .founders-grid { grid-template-columns: repeat(2, 1fr); }
    .crew-grid { max-width: 100%; }
  }

  @media (max-width: 400px) {
    .founders-grid { grid-template-columns: repeat(2, 1fr); }
    .crew-grid     { grid-template-columns: repeat(2, 1fr); max-width: 100%; }
  }

  .member-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
    cursor: default;
  }
  .member-card:hover {
    border-color: var(--orange);
    transform: translateY(-3px);
  }

  .member-photos {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: #1a1a1a;
    overflow: hidden;
  }

  .member-photos img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .photo-2 {
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .member-card:hover .photo-2 { opacity: 1; }

  .photo-2-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(252,76,2,0.85);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  .member-card:hover .photo-2-badge { opacity: 1; }

  .member-info {
    padding: 14px 16px 16px;
    border-top: 1px solid var(--border);
  }

  .member-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.45rem;
    color: var(--text);
    letter-spacing: 1.5px;
    line-height: 1.1;
  }

  .member-role {
    font-size: 11px;
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    margin-top: 4px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="container">

    <a class="back-link" href="/">← Leaderboard</a>

  <div class="founders-grid">

  <!-- Crew -->

  <div class="crew-grid">

      </div>
      <div class="member-info">

    </div>

    <div class="member-card">
      <div class="member-photos">

        <img src="images/team/Rish1.jpeg" alt="Rishendra" class="photo-2">

      </div>
      <div class="member-info">
        <div class="member-name">Rishendra</div>

      </div>
    </div>

  </div>

</div>
