name: Update KFS Leaderboard

on:
  schedule:
    # Every night at 18:15 UTC = 23:45 IST (catches all evening runs, Mon check uses IST)
    - cron: '15 18 * * *'
  workflow_dispatch:   # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run leaderboard update
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_ID:       ${{ secrets.STRAVA_CLUB_ID }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/seen_activities.json scripts/current_week_activities.json scripts/historical_weeks.json
          git diff --cached --quiet || git commit -m "auto: leaderboard update $(date +'%Y-%m-%d')"
          git push
